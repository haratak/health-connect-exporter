name: Android APK

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare APK name
        id: apk
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            APK_NAME="health-connect-exporter-${GITHUB_REF_NAME}.apk"
          else
            APK_NAME="health-connect-exporter-debug.apk"
          fi
          APK_PATH="${RUNNER_TEMP}/${APK_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_PATH}"
          echo "name=${APK_NAME}" >> "${GITHUB_OUTPUT}"
          echo "path=${APK_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: health-connect-exporter-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release APK
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${APK_PATH}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${APK_PATH}" \
              --title "Health Connect Exporter ${GITHUB_REF_NAME}" \
              --notes "Debug APK for Health Connect Exporter ${GITHUB_REF_NAME}."
          fi
