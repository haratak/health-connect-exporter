name: Android APK

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        if: github.ref_type != 'tag'
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare debug APK name
        if: github.ref_type != 'tag'
        id: debug-apk
        shell: bash
        run: |
          APK_NAME="health-connect-exporter-debug.apk"
          APK_PATH="${RUNNER_TEMP}/${APK_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_PATH}"
          echo "name=${APK_NAME}" >> "${GITHUB_OUTPUT}"
          echo "path=${APK_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Upload debug APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: health-connect-exporter-debug-apk
          path: ${{ steps.debug-apk.outputs.path }}
          if-no-files-found: error

      - name: Validate release signing secrets
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "${ANDROID_RELEASE_KEYSTORE_BASE64}"
          test -n "${ANDROID_RELEASE_STORE_PASSWORD}"
          test -n "${ANDROID_RELEASE_KEY_ALIAS}"
          test -n "${ANDROID_RELEASE_KEY_PASSWORD}"

      - name: Decode release keystore
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        id: release-keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/health-connect-exporter-release.jks"
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          echo "path=${KEYSTORE_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Build release APK
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          ANDROID_RELEASE_STORE_FILE: ${{ steps.release-keystore.outputs.path }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Prepare release APK name
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        id: release-apk
        shell: bash
        run: |
          APK_NAME="health-connect-exporter-${GITHUB_REF_NAME}-release.apk"
          APK_PATH="${RUNNER_TEMP}/${APK_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "${APK_PATH}"
          echo "name=${APK_NAME}" >> "${GITHUB_OUTPUT}"
          echo "path=${APK_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Upload release APK artifact
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: actions/upload-artifact@v6
        with:
          name: health-connect-exporter-release-apk
          path: ${{ steps.release-apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release APK
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.release-apk.outputs.path }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${APK_PATH}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${APK_PATH}" \
              --title "Health Connect Exporter ${GITHUB_REF_NAME}" \
              --notes "Release APK for Health Connect Exporter ${GITHUB_REF_NAME}. This APK is built with the Android release build type and signed with the app release key."
          fi
